# Production overlay: puts the whole stack behind Caddy (automatic HTTPS)
# on the VM's own public hostname, so the browser talks DIRECTLY to the VM
# in a single hop. Replaces the Cloudflare Pages + Tailscale Funnel path.
#
# Usage on the VM:
#   export SITE_ADDRESS=mtrportal.duckdns.org
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  caddy:
    image: caddy:2-alpine
    container_name: portal-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    # Host uses systemd-resolved (127.0.0.53), which is unreachable from inside
    # containers — give Caddy real upstream resolvers so ACME/Let's Encrypt
    # lookups work.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your public host, e.g. mtrportal.duckdns.org}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Same origin over real HTTPS now, so mark the session cookie Secure and
  # point the backend at its real public URL.
  backend:
    environment:
      COOKIE_SECURE: "true"
      # uvicorn worker processes. The free-tier VM has 2 vCPUs, so 2 workers
      # saturate both cores under load. Bump only if you also grow RAM/swap —
      # each worker is ~120-180 MB. Override per-deploy without a rebuild.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      FRONTEND_URL: "https://${SITE_ADDRESS}"
      # Must exactly match an Authorized redirect URI in Google Cloud Console.
      # Without this, the backend falls back to the localhost default and Google
      # bounces the browser to the user's own machine instead of the VM.
      GOOGLE_REDIRECT_URI: "https://${SITE_ADDRESS}/api/auth/google/callback"
      # Google SSO credentials. Set here in the compose `environment:` block so
      # they always win over any stale backend/.env on the VM. The Client ID is
      # public (it travels in the OAuth redirect URL); the secret must NEVER be
      # committed, so it is read from the deploying shell's environment:
      #   export GOOGLE_CLIENT_SECRET=... before `docker compose ... up`.
      GOOGLE_CLIENT_ID: "446030339213-jfn9k6rr3r3mqrkfjojbd4753694f2oi.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in your shell before deploying (see deploy runbook)}
      # Google Sheets round-trip (bulk editor "Open in Sheets" / "Pull from
      # Sheet" + inventory mirror). Optional: empty defaults keep the feature
      # disabled without breaking the deploy. The key is the service-account
      # JSON base64-encoded (base64 -w0 key.json), so no file has to be mounted.
      GOOGLE_SHEETS_CREDENTIALS_B64: ${GOOGLE_SHEETS_CREDENTIALS_B64:-}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      # Shared secret for the live sheet->DB webhook (the spreadsheet's bound
      # Apps Script sends it on every edit). Empty leaves the webhook disabled.
      SHEETS_SYNC_TOKEN: ${SHEETS_SYNC_TOKEN:-}

volumes:
  caddy_data:
  caddy_config:
