server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Course bundles (zip uploads) are several MB; nginx defaults to 1 MB.
    client_max_body_size 30m;

    # Same-origin proxy to the backend, exactly like the Vite dev proxy —
    # the browser only ever talks to this origin, so the session cookie
    # and CORS both just work with zero extra config.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth discovery for outside AI agents connecting to /api/ai/mcp
    # (RFC 9728 / RFC 8414 put these at the origin's root).
    location /.well-known/oauth- {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA: the service worker, its manifest and the HTML shell must always be
    # revalidated, or installed apps get stuck on an old build.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest|index\.html)$ {
        types {
            application/javascript js;
            application/manifest+json webmanifest;
            text/html html;
        }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React Router: let the app handle unknown paths client-side.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
