name: CI/CD

# CI on every PR and push to main/staging; CD (build+push images, deploy to the
# VM) only on push, and only after the tests and the frontend build pass:
#   push to main    -> production  (https://portal.mindtechrobotics.com)
#   push to staging -> staging     (https://staging.portal.mindtechrobotics.com)
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

# One run per ref; a newer push cancels the older in-flight run.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push images to GHCR

env:
  # -> ghcr.io/seif-walid/mtr_portal  (lowercased in the images job)
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # ------------------------------------------------------------------ CI
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        # Tests use in-memory SQLite (see tests/conftest.py) — no DB service needed.
        # Each test builds its own DB, so they parallelise across all cores.
        run: pytest -q -n auto

  frontend-build:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck & build
        working-directory: frontend
        # `npm run build` == `tsc --noEmit && vite build`
        run: npm run build

  # -------------------------------------------------- Build images (CI+CD)
  # Runs in PARALLEL with the tests (no `needs`) — the deploy jobs are what wait
  # for tests to pass. On PRs: build only, to catch Dockerfile breakage. On
  # push: push only the immutable :<sha> tag; the moving :latest / :staging tag
  # is applied by the deploy job after tests pass, so an untested image is
  # never "latest".
  #
  # Layer cache lives in GHCR (:buildcache), not the GHA cache: the GHA cache
  # gets evicted, the apt/pip layers then rebuild with new digests, and the VM
  # has to download ~190 MB again on every such deploy.
  images:
    name: Build ${{ matrix.service }} image${{ github.event_name == 'push' && ' & push' || '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute lowercase image name
        id: meta
        run: echo "image=${IMAGE_BASE,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build${{ github.event_name == 'push' && ' & push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
            type=gha,scope=${{ matrix.service }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}:buildcache,mode=max', steps.meta.outputs.image) || format('type=gha,mode=max,scope={0}', matrix.service) }}

  # ------------------------------------------------------------------ CD
  deploy:
    name: Deploy to VM
    needs: [backend-tests, frontend-build, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # add required reviewers here to gate prod deploys
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point :latest at this commit's tested images
        run: |
          base="${IMAGE_BASE,,}"
          for svc in backend frontend; do
            docker buildx imagetools create -t "${base}-${svc}:latest" "${base}-${svc}:${GITHUB_SHA}"
          done
      - name: Pin image tags for this commit
        run: |
          base="${IMAGE_BASE,,}"
          echo "BACKEND_IMAGE=${base}-backend:${GITHUB_SHA}"   >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${base}-frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Write SSH key
        # VM_SSH_KEY is stored base64-encoded so no trailing-newline / whitespace
        # mangling can corrupt it (`base64 -w0 ~/.ssh/your_key`). Decode to a file.
        run: |
          umask 077
          echo "${{ secrets.VM_SSH_KEY }}" | base64 -d > "${{ runner.temp }}/vm_key"
      - name: Deploy over SSH (pull prebuilt images, restart stack)
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS || 'portal.mindtechrobotics.com' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APP_DIR: ${{ secrets.VM_APP_DIR || '~/MTR_Portal' }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key_path: ${{ runner.temp }}/vm_key
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          # Forward these env vars into the remote shell.
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,GHCR_USER,GHCR_TOKEN,SITE_ADDRESS,GOOGLE_CLIENT_SECRET,APP_DIR
          script: |
            set -euo pipefail
            cd "${APP_DIR/#\~/$HOME}"

            # Get the compose files for this commit (image: refs, overlay changes).
            git fetch --prune origin main
            git checkout main
            git reset --hard origin/main   # match the just-pushed commit exactly

            # Auth to GHCR (packages can stay private) and pull the prebuilt images.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export BACKEND_IMAGE FRONTEND_IMAGE SITE_ADDRESS GOOGLE_CLIENT_SECRET
            # Shared with the staging stack; Caddy reaches staging through it.
            docker network create portal-edge >/dev/null 2>&1 || true
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $COMPOSE pull
            $COMPOSE up -d --remove-orphans   # no --build: uses the pulled images
            docker image prune -f
            docker logout ghcr.io

  # --------------------------------------------------------- CD (staging)
  # Separate compose project in its own checkout (~/MTR_Portal_staging) so it
  # never touches production. See deploy/STAGING.md.
  deploy-staging:
    name: Deploy staging to VM
    needs: [backend-tests, frontend-build, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point :staging at this commit's tested images
        run: |
          base="${IMAGE_BASE,,}"
          for svc in backend frontend; do
            docker buildx imagetools create -t "${base}-${svc}:staging" "${base}-${svc}:${GITHUB_SHA}"
          done
      - name: Pin image tags for this commit
        run: |
          base="${IMAGE_BASE,,}"
          echo "BACKEND_IMAGE=${base}-backend:${GITHUB_SHA}"   >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${base}-frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Write SSH key
        run: |
          umask 077
          echo "${{ secrets.VM_SSH_KEY }}" | base64 -d > "${{ runner.temp }}/vm_key"
      - name: Deploy staging over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key_path: ${{ runner.temp }}/vm_key
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,GHCR_USER,GHCR_TOKEN,GOOGLE_CLIENT_SECRET,REPO_URL
          script: |
            set -euo pipefail
            STAGING_DIR="$HOME/MTR_Portal_staging"
            [ -d "$STAGING_DIR/.git" ] || git clone "$REPO_URL" "$STAGING_DIR"
            cd "$STAGING_DIR"
            git fetch --prune origin staging
            git checkout -B staging origin/staging
            git reset --hard origin/staging

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export BACKEND_IMAGE FRONTEND_IMAGE GOOGLE_CLIENT_SECRET
            docker network create portal-edge >/dev/null 2>&1 || true
            COMPOSE="docker compose -f docker-compose.staging.yml"
            $COMPOSE pull
            $COMPOSE up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
