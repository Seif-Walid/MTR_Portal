name: CI/CD

# CI on every PR and push to main; CD (build+push images, deploy to the VM)
# only on push to main, and only after the tests and the frontend build pass.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref; a newer push cancels the older in-flight run.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push images to GHCR

env:
  # -> ghcr.io/seif-walid/mtr_portal  (lowercased in the images job)
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # ------------------------------------------------------------------ CI
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        # Tests use in-memory SQLite (see tests/conftest.py) — no DB service needed.
        run: pytest -q

  frontend-build:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck & build
        working-directory: frontend
        # `npm run build` == `tsc --noEmit && vite build`
        run: npm run build

  # -------------------------------------------------- Build images (CI+CD)
  # On PRs: build only, to catch Dockerfile breakage before merge.
  # On push to main: build AND push :latest + :<sha> to GHCR.
  images:
    name: Build images${{ github.event_name == 'push' && ' & push to GHCR' || '' }}
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.meta.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute lowercase image base
        id: meta
        run: echo "base=${IMAGE_BASE,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.base }}-backend:latest
            ${{ steps.meta.outputs.base }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.base }}-frontend:latest
            ${{ steps.meta.outputs.base }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ------------------------------------------------------------------ CD
  deploy:
    name: Deploy to VM
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # add required reviewers here to gate prod deploys
    steps:
      - name: Pin image tags for this commit
        run: |
          base="${IMAGE_BASE,,}"
          echo "BACKEND_IMAGE=${base}-backend:${GITHUB_SHA}"   >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${base}-frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Write SSH key
        # VM_SSH_KEY is stored base64-encoded so no trailing-newline / whitespace
        # mangling can corrupt it (`base64 -w0 ~/.ssh/your_key`). Decode to a file.
        run: |
          umask 077
          echo "${{ secrets.VM_SSH_KEY }}" | base64 -d > "${{ runner.temp }}/vm_key"
      - name: Deploy over SSH (pull prebuilt images, restart stack)
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS || 'mindtechrobotics.duckdns.org' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_SHEETS_CREDENTIALS_B64: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_B64 }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          SHEETS_SYNC_TOKEN: ${{ secrets.SHEETS_SYNC_TOKEN }}
          APP_DIR: ${{ secrets.VM_APP_DIR || '~/MTR_Portal' }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key_path: ${{ runner.temp }}/vm_key
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          # Forward these env vars into the remote shell.
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,GHCR_USER,GHCR_TOKEN,SITE_ADDRESS,GOOGLE_CLIENT_SECRET,GOOGLE_SHEETS_CREDENTIALS_B64,GOOGLE_SHEETS_SPREADSHEET_ID,SHEETS_SYNC_TOKEN,APP_DIR
          script: |
            set -euo pipefail
            cd "${APP_DIR/#\~/$HOME}"

            # Get the compose files for this commit (image: refs, overlay changes).
            git fetch --prune origin main
            git checkout main
            git reset --hard origin/main   # match the just-pushed commit exactly

            # Auth to GHCR (packages can stay private) and pull the prebuilt images.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export BACKEND_IMAGE FRONTEND_IMAGE SITE_ADDRESS GOOGLE_CLIENT_SECRET
            export GOOGLE_SHEETS_CREDENTIALS_B64 GOOGLE_SHEETS_SPREADSHEET_ID SHEETS_SYNC_TOKEN
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $COMPOSE pull
            $COMPOSE up -d --remove-orphans   # no --build: uses the pulled images
            docker image prune -f
            docker logout ghcr.io
